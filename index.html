/* UX v0.7 shopping assistance */
.tool-launcher{display:grid;gap:12px;margin:12px 0 22px}
.tool-launch{display:flex;width:100%;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:18px 16px;min-height:84px}

.bundle-switch{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--radius-sm);padding:12px;font-size:13px;font-weight:750;text-align:left;margin:3px 0 16px;width:100%;min-height:49px}

.discount-panel{padding:18px}.discount-panel .formrow{margin:0 0 18px}.discount-results{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0 10px;border-top:1px solid var(--line)}
.discount-results div{display:flex;flex-direction:column;gap:6px}.discount-results small{font-size:12px;color:var(--muted)}.discount-results strong{font-size:23px;letter-spacing:-.03em}

/* v0.8: user-managed inventory categories and entry assistance */
.category-section{margin:0 0 12px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.category-title{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:var(--surface2);color:var(--ink);padding:13px 14px;min-height:46px;text-align:left}
.category-title strong{font-size:14px}.category-title span{font-size:12px;color:var(--muted)}
.category-products{padding:0 10px}.category-products .inventory-item:last-child{border-bottom:0}
.category-settings{display:flex;flex-direction:column;gap:8px}.category-setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm)}
.category-setting button{min-height:40px}.category-setting small{color:var(--muted)}
.category-add{display:flex;gap:8px;margin-top:10px}.category-add input{flex:1;min-width:0}

@media(max-width:360px){.category-add{flex-wrap:wrap}.category-add button{flex-shrink:0}}

<body data-theme="stylish"><div id="app"></div>
<script>
(()=>{'use strict';
const KEY='shopping-support-ux-demo-v03'; // v0.3 の既存デモデータを維持
const icons={shop:'<path d="M3 6h2l2 11h11l2-8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/>',stock:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M3 11h18M8 3h8v4"/>',compare:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 10h2m4 0h2M8 14h2m4 0h2M8 18h8"/>',history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l-1.7 1.7a1.6 1.6 0 0 0-1.8-.3l-1.6.6a1.6 1.6 0 0 0-1 1.5V22h-2.4v-1.7a1.6 1.6 0 0 0-1-1.5l-1.6-.6a1.6 1.6 0 0 0-1.8.3L5 16.8a1.6 1.6 0 0 0 .3-1.8l-.6-1.6a1.6 1.6 0 0 0-1.5-1H2V10h1.7a1.6 1.6 0 0 0 1.5-1l.6-1.6A1.6 1.6 0 0 0 5.5 5.6L7.2 4a1.6 1.6 0 0 0 1.8.3l1.6-.6a1.6 1.6 0 0 0 1-1.5V2h2.4v.2a1.6 1.6 0 0 0 1 1.5l1.6.6a1.6 1.6 0 0 0 1.8-.3l1.7 1.6a1.6 1.6 0 0 0-.3 1.8l.6 1.6a1.6 1.6 0 0 0 1.5 1H22v2.4h-1.7a1.6 1.6 0 0 0-1.5 1z"/>',plus:'<path d="M12 5v14M5 12h14"/>',chevron:'<path d="m9 18 6-6-6-6"/>',check:'<path d="m4 12 5 5L20 6"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>'};
function svg(id){return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${icons[id]||icons.stock}</svg>`}
const seed=()=>({schemaVersion:'UX-DEMO-0.3',theme:'stylish',items:[
{id:'i1',name:'洗濯洗剤',detail:'いつもの洗剤',volume:900,vu:'mL',unit:'本',qty:1,line:1,target:3,emoji:'🧴',cycle:true,archived:false,postpone:false},
{id:'i2',name:'ティッシュ',detail:'',volume:null,vu:'枚',unit:'箱',qty:0,line:1,target:2,emoji:'🧻',cycle:true,archived:false,postpone:false},
{id:'i3',name:'歯磨き粉',detail:'',volume:null,vu:'g',unit:'本',qty:2,line:1,target:3,emoji:'🪥',cycle:false,archived:false,postpone:false},
{id:'i4',name:'シャンプー',detail:'',volume:null,vu:'mL',unit:'個',qty:3,line:1,target:3,emoji:'🫧',cycle:false,archived:false,postpone:false},
{id:'i5',name:'単3電池',detail:'',volume:null,vu:'個',unit:'セット',qty:1,line:0,target:2,emoji:'🔋',cycle:false,archived:false,postpone:false}],

next:10});
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null');if(!state||state.schemaVersion!=='UX-DEMO-0.3')state=seed()}catch(_){state=seed()}
// Retired cute theme is converted without discarding any saved stock or history.
if(!['stylish','dark-blue'].includes(state.theme))state.theme='stylish';
let tab='shop',modal=null,mode='active',search='',compareLink='',lastUndo=null,toast=null,seq=0,reordering=false,toastTimer=null,dragging=null;
const HISTORY_PAGE_SIZE=10;
let historyFilter='all',historyPage=0,historyCollapsed=false;
const collapsedCategoryIds=new Set();
// ホーム画面へ追加したiPhoneでは画面上部のステータスバーを避ける。
document.body.classList.toggle('standalone',!!(navigator.standalone||window.matchMedia?.('(display-mode: standalone)').matches));const freshCompare=()=>({a:{price:'',volume:''},b:{price:'',volume:''}});
let cmp=freshCompare();
let toolView='home', bundleMode=false, bundleCount={a:'',b:''}, discount={price:'',percent:''};

const CATEGORY_LIMIT=5;
const UNCATEGORIZED='uncategorized';
const DEFAULT_CATEGORIES=[{id:'cat-daily',name:'日用品'},{id:'cat-kitchen',name:'キッチン用品'},{id:'cat-food',name:'食品・調味料'}];
const cleanedName=value=>String(value||'').normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ');
function categoryName(id){return id===UNCATEGORIZED?'未分類':state.categories.find(c=>c.id===id)?.name||'未分類'}
function categoryExists(data,id){return id===UNCATEGORIZED||data.categories.some(c=>c.id===id)}
function inferCategoryFor(data,name){
 const term=cleanedName(name);
 if(!term)return UNCATEGORIZED;
 const learned=data.categoryPrefs[term];
 if(typeof learned==='string'&&categoryExists(data,learned))return learned;
 if(/キッチン.*スポンジ|食器|ラップ|アルミホイル|ホイル|クッキングシート|保存袋|ジップロック|キッチンペーパー|台所|ふきん|フライパン|弁当箱/.test(term))return categoryExists(data,'cat-kitchen')?'cat-kitchen':UNCATEGORIZED;
 if(/しょうゆ|醤油|みりん|砂糖|食塩|^塩$|味噌|みそ|ケチャップ|マヨネーズ|調味料|料理酒|スパイス|だし|胡椒|こしょう|パスタ|乾麺|レトルト|缶詰|お米/.test(term))return categoryExists(data,'cat-food')?'cat-food':UNCATEGORIZED;
 if(/洗濯|柔軟剤|トイレットペーパー|ティッシュ|シャンプー|ボディソープ|歯磨|歯ブラシ|入浴|掃除|電池|ゴミ袋|ごみ袋|洗顔|消臭|除菌|ハンドソープ/.test(term))return categoryExists(data,'cat-daily')?'cat-daily':UNCATEGORIZED;
 return UNCATEGORIZED;
}
function normalizeCategories(data){
 if(!Array.isArray(data.categories))data.categories=DEFAULT_CATEGORIES.map(c=>({...c}));
 else{
  const valid=[],usedId=new Set(),usedName=new Set();
  for(const c of data.categories.slice(0,50)){
   if(!c||typeof c.id!=='string'||typeof c.name!=='string')continue;
   const id=c.id.trim(),name=c.name.trim(),norm=cleanedName(name);
   if(!id||id===UNCATEGORIZED||id.length>70||!name||name.length>24||usedId.has(id)||usedName.has(norm))continue;
   valid.push({id,name});usedId.add(id);usedName.add(norm);
   if(valid.length===CATEGORY_LIMIT)break;
  }
  data.categories=valid;
 }
 if(!data.categoryPrefs||typeof data.categoryPrefs!=='object'||Array.isArray(data.categoryPrefs))data.categoryPrefs={};
 const cleanPrefs=Object.create(null);
 for(const [key,id] of Object.entries(data.categoryPrefs).slice(0,1000)){
  const normalized=cleanedName(key);
  if(normalized&&normalized.length<=100&&typeof id==='string'&&categoryExists(data,id))cleanPrefs[normalized]=id;
 }
 data.categoryPrefs=cleanPrefs;
 for(const item of data.items||[]){
  if(!categoryExists(data,item.categoryId))item.categoryId=inferCategoryFor(data,item.name);
 }
 return data;
}
function learnCategory(name,id){
 const key=cleanedName(name);
 if(key&&categoryExists(state,id))state.categoryPrefs[key]=id;
}
function purchaseSuggestions(type,itemId){
 const seen=new Set(),out=[];
 for(const log of state.logs.slice().reverse()){
  if(log.kind!=='purchase'||type==='detail'&&(!itemId||log.itemId!==itemId))continue;
  const v=String(log[type]||'').trim(),key=cleanedName(v);
  if(v&&!seen.has(key)){seen.add(key);out.push(v)}
  if(out.length>=4)break;
 }
 return out;
}
function suggestionChips(type,itemId){
 const values=purchaseSuggestions(type,itemId);
 if(!values.length)return '';
 const title=type==='store'?'最近の店舗':'この商品で購入した商品名';
 return '<div class="suggestions"><span>'+title+'</span><div>'+
 values.map(v=>'<button type="button" class="suggest-chip" data-act="suggest-'+type+'" data-value="'+esc(v)+'">'+esc(v)+'</button>').join('')+
 '</div></div>';
}

normalizeCategories(state);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(_){}}
function nextid(prefix){return prefix+(++state.next)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function one(id){return state.items.find(x=>x.id===id)}
function unit(x){return x.unit||'個'}
function pending(x){return !x.archived && x.cycle && x.qty<x.target&&!x.postpone}
function pendingItems(){return state.items.filter(pending)}
function stockStatus(x){return x.cycle&&x.qty<x.target?(x.qty===0?'empty':'low'):'normal'}
function clearToast(){if(toastTimer!==null){clearTimeout(toastTimer);toastTimer=null}toast=null;lastUndo=null}
function moveItem(id,targetId){const from=state.items.findIndex(x=>x.id===id),to=state.items.findIndex(x=>x.id===targetId);if(from<0||to<0||from===to)return false;const [item]=state.items.splice(from,1);state.items.splice(to,0,item);save();return true}
function reorderByDirection(id,direction){
 const x=one(id);if(!x)return;
 const group=state.items.filter(y=>!y.archived&&y.categoryId===x.categoryId&&(!search||y.name.toLowerCase().includes(search.toLowerCase())));
 const p=group.findIndex(y=>y.id===id),other=group[p+direction];
 if(!other)return;
 const from=state.items.findIndex(y=>y.id===id),to=state.items.findIndex(y=>y.id===other.id);
 [state.items[from],state.items[to]]=[state.items[to],state.items[from]];
 save();render();
}
function allNeeded(){return pendingItems().length+state.manual.filter(m=>!m.done).length}
function clock(iso){const d=new Date(iso);return Number.isNaN(+d)?'-':d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function resultScreen(){return ({shop:screenShop,stock:screenStock,compare:screenCompare,history:screenHistory,settings:screenSettings})[tab]()}
function render(){document.body.dataset.theme=state.theme;document.body.classList.toggle('modal-open',!!modal);document.querySelector('meta[name="theme-color"]').content=state.theme==='dark-blue'?'#0d1828':'#f4f6f5';document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="logo">${'S.'}</div><div><b>stock note.</b><small>SHOPPING SUPPORT</small></div></div><span class="demo">UX REVIEW · v0.8</span></header>${resultScreen()}</div><nav class="nav" aria-label="主要メニュー">${[['shop','買い物'],['stock','在庫'],['compare','買い物支援'],['history','履歴'],['settings','設定']].map(([id,name])=>`<button data-act="tab" data-id="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}">${svg(id)}<span>${name}</span></button>`).join('')}</nav>${modal?sheet():''}${toast?`<div class="toast" role="status" aria-live="polite"><span>${esc(toast.text)}</span>${lastUndo?'<button data-act="undo">元に戻す</button>':''}<button data-act="toast-close" aria-label="通知を閉じる">×</button></div>`:''}`;save()}
function head(k,h,desc){return `<header class="pagehead"><div class="kicker">${k}</div><h1>${h}</h1>${desc?`<p>${desc}</p>`:''}</header>`}
function screenShop(){const auto=pendingItems(),manual=state.manual.filter(m=>!m.done),post=state.items.filter(x=>x.postpone&&!x.archived&&x.cycle&&x.qty<x.target);return `${head('SHOPPING LIST','買い物リスト','')}<section class="hero"><div class="eyebrow">補充・買い物の予定</div><div class="count"><strong>${auto.length+manual.length}</strong><span>件のお買い物</span></div><div class="sub">在庫から自動追加 ${auto.length}件 ・ メモ ${manual.length}件</div></section><div class="h2"><h2>補充が必要</h2><span class="hint">目標数まで自動で表示</span></div><div class="panel">${auto.length?auto.map(x=>`<article class="item"><span class="list-marker ${stockStatus(x)==='empty'?'is-zero':stockStatus(x)}" aria-hidden="true"></span><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemmeta">在庫 ${x.qty}${esc(unit(x))} → 目標 ${x.target}${esc(unit(x))}<br/><span class="badge-green">あと ${Math.max(0,x.target-x.qty)}${esc(unit(x))}</span>必要</div></div><div class="itemactions"><button class="secondary" style="min-height:42px;padding:9px;font-size:11px" aria-label="${esc(x.name)}を今回は見送る" data-act="postpone" data-id="${x.id}" title="今回は見送る">あとで</button><button class="primary" data-act="buy" data-id="${x.id}">購入</button></div></article>`).join(''):`<div class="empty"><strong>補充が必要なものはありません</strong>目標数に達すると自動で非表示になります。</div>`}</div><div class="h2"><h2>買い物メモ</h2><button class="linkbtn" data-act="add-manual">＋ 追加</button></div><div class="panel">${manual.length?manual.map(m=>`<div class="item"><span class="list-marker neutral" aria-hidden="true"></span><div class="itembody"><div class="itemtitle">${esc(m.name)}</div><div class="itemmeta">在庫とは連動しないメモ</div></div><button class="secondary" data-act="manual-done" data-id="${m.id}">購入済み</button></div>`).join(''):`<div class="empty">メモはありません。買いたいものを自由に追加できます。</div>`}</div>${post.length?`<div class="h2"><h2>今回は見送ったもの</h2><span class="hint">${post.length}件</span></div><div class="panel">${post.map(x=>`<div class="item"><span class="list-marker ${stockStatus(x)==='empty'?'is-zero':stockStatus(x)}" aria-hidden="true"></span><div class="itembody"><div class="itemtitle">${esc(x.name)}</div><div class="itemmeta">在庫 ${x.qty}${esc(unit(x))}／目標 ${x.target}${esc(unit(x))}</div></div><button class="secondary" data-act="resume" data-id="${x.id}">戻す</button></div>`).join('')}</div>`:''}`}
function screenStock(){
 const visible=state.items.filter(x=>!x.archived),filtered=visible.filter(x=>x.name.toLowerCase().includes(search.toLowerCase()));
 const groups=[...state.categories,{id:UNCATEGORIZED,name:'未分類'}].map(c=>({id:c.id,name:c.name,items:filtered.filter(x=>x.categoryId===c.id)})).filter(g=>g.items.length);
 return `${head('MY INVENTORY','在庫一覧','在庫は未開封品のみ。')}
 <div class="grid2 stock-summary"><div class="metric"><div class="m-head">管理中の商品</div><div class="m-val">${visible.length}<span class="metric-unit">種類</span></div></div><div class="metric"><div class="m-head">補充の対象</div><div class="m-val">${pendingItems().length}<span class="metric-unit">種類</span></div></div></div>
 <div class="toolbar stock-toolbar">${reordering?`<div class="reorder-intro">長押しして移動、または矢印で並び替え</div>`:`<input id="search" class="field" enterkeyhint="done" data-next="" value="${esc(search)}" placeholder="商品を探す" aria-label="商品を探す"/>`}

 <section class="panel inventory-list" aria-label="在庫商品の一覧">${filtered.length?groups.map(group=>`<section class="category-section" data-category-section><button type="button" class="category-title" data-act="category-toggle" data-id="${esc(group.id)}" aria-expanded="${!collapsedCategoryIds.has(group.id)}"><strong>${esc(group.name)}</strong><span>${group.items.length}件 ${collapsedCategoryIds.has(group.id)?'＋':'−'}</span></button><div class="category-products" ${collapsedCategoryIds.has(group.id)?'hidden':''}>${group.items.map((x,index)=>{
 const status=stockStatus(x),label=status==='empty'?'在庫がありません':status==='low'?'補充目安に達しています':'通常の在庫';
 return `<article class="item inventory-item ${status==='normal'?'':`stock-${status}`} ${reordering?'is-sortable':''}" data-inventory-row data-order-id="${x.id}" data-name="${esc(x.name.toLowerCase())}">
 <span class="stock-mark ${status==='empty'?'is-zero':status}" title="${label}" aria-label="${label}" role="img"><span></span></span>

function unitPack(u){if(['g','kg'].includes(u))return 'g';if(['mL','L'].includes(u))return 'mL';if(['個','枚','本','箱','パック','セット'].includes(u))return u;return null}
function normalized(v){const p=Number(v.price),q=Number(v.volume),u=v.unit;if(!Number.isFinite(p)||!Number.isFinite(q)||p<=0||q<=0||!unitPack(u))return null;let qbase=q;if(u==='kg'||u==='L')qbase=q*1000;const dim=unitPack(u);const per=dim==='個'?1:100;return {n:p/qbase*per,dim,per}}
function unitlessRate(v){const p=Number(v.price),q=Number(v.volume);if(v.price===''||v.volume===''||!Number.isFinite(p)||!Number.isFinite(q)||p<=0||q<=0)return null;return {n:p/q}}
function compareRateFor(k){
 const base=unitlessRate(cmp[k]);if(!base)return null;
 const packs=bundleMode&&toolView==='unit'?(bundleCount[k]===''?1:Number(bundleCount[k])):1;
 if(!Number.isSafeInteger(packs)||packs<=0||packs>99999)return null;
 const amount=Number(cmp[k].volume)*packs;
 if(!Number.isFinite(amount)||amount<=0)return null;
 const scale=toolView==='per100'?100:1;
 return {n:base.n*scale/packs,total:amount,scale};
}
function cmpResult(){const a=compareRateFor('a'),b=compareRateFor('b');if(!a||!b)return null;return {a,b,better:Math.abs(a.n-b.n)<1e-9?'same':a.n<b.n?'a':'b'}}
function discountResult(){const p=Number(discount.price),d=Number(discount.percent);if(discount.price===''||discount.percent===''||!Number.isFinite(p)||!Number.isFinite(d)||p<=0||d<0||d>100)return null;const saving=Math.round(p*d/100);return {saving,total:Math.max(0,Math.round(p-saving))}}
function pastPriceText(){if(!compareLink)return '過去購入単価を見たい場合は管理品目を選んでください。';const arr=state.logs.filter(l=>l.kind==='purchase'&&l.itemId===compareLink&&l.price>0&&l.volume>0).slice().reverse();if(!arr.length)return 'この品目には比較可能な購入価格の記録がありません。';const l=arr[0];const r=normalized({price:l.price,volume:l.volume*Math.max(1,Number(l.qty)||1),unit:l.vu||'mL'});if(!r)return '過去の購入内容量が未記録のため比較できません。';return `前回記録した単価：約${r.n.toFixed(1)}円 / ${r.per}${r.dim}（${esc(clock(l.when))}） ※自分の購入履歴`;}

else if(m.type==='category-edit'){
 const c=state.categories.find(x=>x.id===m.id);
 inner='<div class="sheettitle"><h2>分類名を変更</h2><button class="iconbtn small" data-act="modal-close">×</button></div>'+
 '<div class="formrow"><label for="editCategoryName">分類名</label><input id="editCategoryName" class="field" maxlength="24" value="'+esc(c?.name||'')+'" placeholder="分類名"/></div>'+
 '<p class="fine">名前を変えても、分類済みの商品と自動補助の紐づけは維持します。</p>'+
 '<div class="footactions"><button class="primary full" data-act="category-save">変更を保存</button><button class="secondary full" data-act="modal-close">やめる</button></div>';
}
else if(m.type==='category-remove'){
 const c=state.categories.find(x=>x.id===m.id),count=state.items.filter(x=>x.categoryId===m.id).length;
 inner='<div class="sheettitle"><h2>分類を削除</h2><button class="iconbtn small" data-act="modal-close">×</button></div>'+
 '<p class="fine">「'+esc(c?.name||'')+'」の登録商品 '+count+' 件を別の分類に移します。商品・購入履歴は削除しません。</p>'+
 '<div class="formrow"><label for="categoryTarget">商品の移動先</label><select id="categoryTarget" class="field">'+
 [...state.categories.filter(x=>x.id!==m.id),{id:UNCATEGORIZED,name:'未分類'}].map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+
 '</select></div>'+
 '<div class="footactions"><button class="primary full" data-act="category-delete">移動して分類を削除</button><button class="secondary full" data-act="modal-close">やめる</button></div>';
}
else if(m.type==='confirm'){inner=`<div class="sheettitle"><h2>${esc(m.title)}</h2><button class="iconbtn small" data-act="modal-close">×</button></div><p style="font-size:13px;line-height:1.7">${esc(m.message)}</p><div class="footactions"><button class="primary full" data-act="confirm">${esc(m.confirmText||'実行する')}</button><button class="secondary full" data-act="modal-close">やめる</button></div>`;}
return `<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>${inner}</div></div>`}
function notify(text,undo){
 if(toastTimer!==null)clearTimeout(toastTimer);
 const noticeId=++seq;toast={text,id:noticeId};lastUndo=undo||null;render();
 // 変更を戻せる操作だけ少し長く。閉じる操作は要求しない。
 toastTimer=setTimeout(()=>{if(toast?.id===noticeId){toast=null;lastUndo=null;document.querySelector('.toast')?.remove()}toastTimer=null},undo?6000:2300);
}
function updateWithUndo(change,label){const before=JSON.stringify(state);change();save();notify(label,()=>{state=JSON.parse(before);toast=null;lastUndo=null;render()})}
function openPurchase(id,opts={}){const x=one(id);const m=state.manual.find(z=>z.id===opts.manual);modal={type:'purchase',id:x?.id||'',manual:m?.id||'',qty:1,more:!!opts.more,price:opts.price??'',volume:opts.volume??'',vu:opts.vu??'',detail:opts.detail??'',store:''};render()}
function safeInt(value){const n=Number(value);return Number.isSafeInteger(n)&&n>=0&&n<=99999?n:null}
function purchaseCommit(){const m=modal,x=one(m.id),man=state.manual.find(y=>y.id===m.manual);if(!m||m.type!=='purchase')return;const qty=safeInt(m.qty);if(!qty){alert('購入数を1以上で入力してください');return}let price=null,vol=null,store='',detail='';if(m.more){const pp=document.getElementById('price')?.value||'';if(pp!==''){price=Number(pp);if(!Number.isSafeInteger(price)||price<=0){alert('価格は1円以上の整数で入力してください');return}}const vv=document.getElementById('purVolume')?.value||'';if(vv!==''){vol=Number(vv);if(!Number.isFinite(vol)||vol<=0){alert('内容量を正しく入力してください');return}}store=document.getElementById('store')?.value.trim()||'';detail=document.getElementById('productDetail')?.value.trim()||''}
const purchasedVu=m.more?(document.getElementById('purUnit')?.value||'mL'):x?.vu;modal=null;updateWithUndo(()=>{if(x){x.qty+=qty;if(x.qty>=x.target){x.cycle=false;x.postpone=false}state.logs.push({id:nextid('log'),kind:'purchase',itemId:x.id,name:x.name,qty,unit:unit(x),when:new Date().toISOString(),price,volume:vol,vu:m.more?purchasedVu:null,store,detail})}else if(man){man.done=true;state.logs.push({id:nextid('log'),kind:'purchase',itemId:'',name:man.name,qty,unit:'件',when:new Date().toISOString(),price,store,detail})}},x?'購入しました。在庫とリストを更新しました':'買い物メモを完了しました');}
function storeItem(){const x=one(modal.id),name=document.getElementById('itemName').value.trim(),qty=safeInt(document.getElementById('itemQty').value||'0'),line=safeInt(document.getElementById('itemLine').value||'1'),target=safeInt(document.getElementById('itemTarget').value||'2'),u=document.getElementById('itemUnit').value;if(!name){alert('管理名を入力してください');return}if(qty===null||line===null||target===null||target<=line){alert('在庫・補充ラインは0以上の整数、目標は補充ラインより大きい値にしてください');return}const detail=document.getElementById('itemDetail')?.value.trim()||'',vs=document.getElementById('itemVolume')?.value||'',volume=vs!==''?Number(vs):null;if(volume!==null&&(!(volume>0)||!Number.isFinite(volume))){alert('容量は0より大きい数値を入力してください');return}const vu=document.getElementById('itemVu')?.value||'mL';const chosen=document.getElementById('itemCategory')?.value||UNCATEGORIZED;const categoryId=modal.categoryTouched?chosen:(x?.categoryId||inferCategoryFor(state,name));if(!categoryExists(state,categoryId)){alert('分類を選び直してください');return}const before=JSON.stringify(state);if(x){const delta=qty-x.qty;x.name=name;x.categoryId=categoryId;x.line=line;x.target=target;x.qty=qty;x.unit=u;x.detail=detail;x.volume=volume;x.vu=vu;if(qty>=target){x.cycle=false;x.postpone=false}else if(qty<=line){x.cycle=true}if(delta)state.logs.push({id:nextid('log'),kind:'adjust',itemId:x.id,name,qty:delta,unit:u,when:new Date().toISOString()})}else{const newx={id:nextid('i'),name,categoryId,detail,volume,vu,unit:u,qty,line,target,cycle:qty<=line,postpone:false,archived:false};state.items.unshift(newx);state.logs.push({id:nextid('log'),kind:'adjust',itemId:newx.id,name,qty,unit:u,when:new Date().toISOString()})}if(modal.categoryTouched)learnCategory(name,categoryId);modal=null;const curr=JSON.stringify(state);if(before!==curr)notify('保存しました',()=>{state=JSON.parse(before);render()});else render()}
function openItem(id){const x=one(id);modal={type:'item',id:id||'',categoryTouched:!!x,categorySelected:x?.categoryId||UNCATEGORIZED};render()}
function reset(){state=seed();normalizeCategories(state);tab='shop';modal=null;search='';compareLink='';save();notify('サンプルデータに戻しました')}
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shopping-support-ux-demo.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('デモ用JSONを出力しました')}
function importJson(){const el=document.createElement('input');el.type='file';el.accept='application/json,.json';el.addEventListener('change',()=>{if(!el.files?.[0])return;const fr=new FileReader();fr.onload=()=>{try{const v=JSON.parse(fr.result);if(v.schemaVersion!=='UX-DEMO-0.3'||!Array.isArray(v.items)||!Array.isArray(v.logs)||!Array.isArray(v.manual)||!['cute','stylish','dark-blue'].includes(v.theme))throw Error('形式が違います');if(v.items.some(z=>!z.id||!Number.isSafeInteger(z.qty)||z.qty<0||!z.name)||v.items.length>10000)throw Error('商品データが不正です');modal={type:'confirm',title:'データを置き換えますか？',message:'いまのデモデータは上書きされます。先にJSONを出力しておくことをおすすめします。',confirmText:'データを復元',callback:()=>{state=v;if(state.theme==='cute')state.theme='stylish';normalizeCategories(state);tab='shop';notify('デモのデータを復元しました')}};render()}catch(e){alert('読み込みできませんでした：'+e.message)}};fr.readAsText(el.files[0]);});el.click()}
function click(el){const act=el.dataset.act,id=el.dataset.id;if(!act)return;
switch(act){case 'tab':if(id==='compare'){cmp=freshCompare();bundleCount={a:'',b:''};bundleMode=false;discount={price:'',percent:''};toolView='home'}if(id==='history'&&tab!=='history'){historyFilter='all';historyPage=0;historyCollapsed=false}tab=id;modal=null;clearToast();reordering=false;render();window.scrollTo(0,0);break;
case 'category-toggle':if(!categoryExists(state,id))break;collapsedCategoryIds.has(id)?collapsedCategoryIds.delete(id):collapsedCategoryIds.add(id);render();break;
case 'category-add':{
 const name=document.getElementById('newCategoryName')?.value.trim()||'';
 if(!name||name.length>24){alert('分類名は1〜24文字で入力してください');break}
 if(state.categories.length>=CATEGORY_LIMIT){alert('分類は最大5件です');break}
 if(state.categories.some(c=>cleanedName(c.name)===cleanedName(name))||cleanedName(name)===cleanedName('未分類')){alert('同じ分類名は登録できません');break}
 updateWithUndo(()=>{state.categories.push({id:nextid('cat'),name})},'分類を追加しました');break;
}
case 'category-edit':if(state.categories.some(c=>c.id===id)){modal={type:'category-edit',id};render()}break;
case 'category-save':{
 const c=state.categories.find(c=>c.id===modal?.id),name=document.getElementById('editCategoryName')?.value.trim()||'';
 if(!c||!name||name.length>24){alert('分類名は1〜24文字で入力してください');break}
 if(cleanedName(name)===cleanedName('未分類')||state.categories.some(x=>x.id!==c.id&&cleanedName(x.name)===cleanedName(name))){alert('同じ分類名は登録できません');break}
 modal=null;updateWithUndo(()=>{c.name=name},'分類名を変更しました');break;
}
case 'category-remove':if(state.categories.some(c=>c.id===id)){modal={type:'category-remove',id};render()}break;
case 'category-delete':{
 const removed=modal?.id,target=document.getElementById('categoryTarget')?.value;
 if(!state.categories.some(c=>c.id===removed)||removed===target||!categoryExists(state,target)){alert('移動先を選んでください');break}
 modal=null;updateWithUndo(()=>{
  state.categories=state.categories.filter(c=>c.id!==removed);
  state.items.forEach(x=>{if(x.categoryId===removed)x.categoryId=target});
  Object.keys(state.categoryPrefs).forEach(k=>{if(state.categoryPrefs[k]===removed)state.categoryPrefs[k]=target});
  collapsedCategoryIds.delete(removed);
 },'分類を削除し、商品を移動しました');break;
}
case 'history-filter':if(!['all','purchase','open','adjust'].includes(id))break;historyFilter=id;historyPage=0;historyCollapsed=false;render();break;
case 'history-toggle':historyCollapsed=!historyCollapsed;render();break;
case 'history-prev':historyPage=Math.max(0,historyPage-1);render();break;
case 'history-next':historyPage=Math.min(Math.max(0,Math.ceil(historyFilteredLogs().length/HISTORY_PAGE_SIZE)-1),historyPage+1);render();break;case 'modal-close':modal=null;render();break;
case 'suggest-store':case 'suggest-detail':if(modal?.type==='purchase'){const key=act==='suggest-store'?'store':'detail';modal[key]=el.dataset.value||'';const field=document.getElementById(key==='store'?'store':'productDetail');if(field)field.value=modal[key]}break;
case 'add-item':openItem('');break;case 'edit-item':openItem(id);break;case 'item-save':storeItem();break;
case 'toggle-reorder':reordering=!reordering;if(reordering)search='';render();if(!reordering)notify('並び順を保存しました');break;
case 'reorder-up':reorderByDirection(id,-1);break;case 'reorder-down':reorderByDirection(id,1);break;
case 'drag-handle':break;
case 'add-manual':modal={type:'manual'};render();break;case 'manual-save':{const name=document.getElementById('manualName')?.value.trim();if(!name){alert('買い物メモを入力してください');return}modal=null;updateWithUndo(()=>state.manual.push({id:nextid('m'),name,done:false}),'メモを追加しました');break}
case 'manual-done':{const m=state.manual.find(x=>x.id===id);if(!m)return;updateWithUndo(()=>{m.done=true;state.logs.push({id:nextid('log'),kind:'purchase',name:m.name,qty:1,unit:'件',itemId:'',when:new Date().toISOString(),price:null})},'買い物メモを完了しました');break}
case 'postpone':{const x=one(id);if(!x)return;updateWithUndo(()=>x.postpone=true,'「今回は見送る」に移しました');break}
case 'resume':{const x=one(id);if(!x)return;updateWithUndo(()=>x.postpone=false,'買い物リストに戻しました');break}
case 'open':{const x=one(id);if(!x||x.qty<=0)return;updateWithUndo(()=>{x.qty--;if(x.qty<=x.line)x.cycle=true;x.postpone=false;state.logs.push({id:nextid('log'),kind:'open',itemId:x.id,name:x.name,qty:-1,unit:unit(x),when:new Date().toISOString()})},'開封して在庫を1減らしました');break}
case 'buy':openPurchase(id);break;
case 'qty-minus':if(modal&&modal.qty>1){modal.qty--;render()}break;
case 'qty-plus':if(modal&&modal.qty<99999){modal.qty++;render()}break;
case 'more-purchase':if(modal){modal.more=!modal.more;render()}break;
case 'purchase-commit':purchaseCommit();break;
case 'tool-select':if(!['unit','discount','per100'].includes(id))break;toolView=id;cmp=freshCompare();bundleCount={a:'',b:''};bundleMode=false;discount={price:'',percent:''};compareLink='';render();break;
case 'tool-home':toolView='home';render();break;
case 'bundle-toggle':bundleMode=!bundleMode;if(!bundleMode)bundleCount={a:'',b:''};render();break;
case 'compare-clear':cmp=freshCompare();bundleCount={a:'',b:''};render();break;
case 'discount-clear':discount={price:'',percent:''};render();break;
case 'cmp-buy':if(compareLink){const c=cmp[id];if(unitlessRate(c))openPurchase(compareLink,{more:true,price:c.price});else notify('価格と数量を入力してください')}else{notify('購入品目を選んでください')}break;
case 'archive':{const x=one(modal.id);if(!x)return;modal={type:'confirm',title:'商品を一覧から外しますか？',message:'商品は一覧から非表示になりますが、購入・開封の履歴は残します。デモの初期化で元に戻せます。',confirmText:'一覧から外す',callback:()=>{const xx=one(x.id);xx.archived=true;notify('一覧から外しました')}};render();break}
case 'confirm':{const cb=modal?.callback;modal=null;if(cb)cb();render();break}
case 'theme':if(!['stylish','dark-blue'].includes(id))break;state.theme=id;notify(id==='dark-blue'?'ダークブルーに切り替えました':'スタイリッシュに切り替えました');break;
case 'export':exportJson();break;case 'import':importJson();break;
case 'reset':modal={type:'confirm',title:'デモを初期化しますか？',message:'追加・購入・開封した内容はサンプルの初期状態に戻ります。必要なら先にJSONを保存してください。',confirmText:'初期化する',callback:reset};render();break;
case 'undo':{const cb=lastUndo;clearToast();if(cb)cb();notify('直前の操作を取り消しました');break}case 'toast-close':clearToast();render();break;
}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)click(t);else if(e.target.id==='overlay'){modal=null;render()}});
// iPhone: pointer-based handle drag (HTML5 drag/drop is unreliable on touch Safari).
// The up/down buttons provide a non-drag fallback and accessible operation.
document.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-act="drag-handle"]');if(!handle||!reordering)return;
 dragging={id:handle.dataset.id,pointerId:e.pointerId};handle.setPointerCapture?.(e.pointerId);
 const row=handle.closest('[data-order-id]');row?.classList.add('is-dragging');
 e.preventDefault();
});
document.addEventListener('pointermove',e=>{
 if(!dragging||dragging.pointerId!==e.pointerId)return;
 document.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
 const over=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-order-id]');
 if(over&&over.dataset.orderId!==dragging.id&&one(over.dataset.orderId)?.categoryId===one(dragging.id)?.categoryId)over.classList.add('drop-target');
});
document.addEventListener('pointerup',e=>{
 if(!dragging||dragging.pointerId!==e.pointerId)return;
 const over=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-order-id]');
 const changed=over&&one(over.dataset.orderId)?.categoryId===one(dragging.id)?.categoryId?moveItem(dragging.id,over.dataset.orderId):false;
 dragging=null;document.querySelectorAll('.is-dragging,.drop-target').forEach(el=>el.classList.remove('is-dragging','drop-target'));
 if(changed)render();
});
document.addEventListener('pointercancel',()=>{dragging=null;document.querySelectorAll('.is-dragging,.drop-target').forEach(el=>el.classList.remove('is-dragging','drop-target'))});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.matches('input[data-next]'))return;e.preventDefault();const id=e.target.dataset.next, next=id?document.getElementById(id):null;if(next){next.focus()}else{e.target.blur()}});
document.addEventListener('input',e=>{if(e.target.dataset.bundle){bundleCount[e.target.dataset.bundle]=e.target.value;refreshCompare()}if(e.target.dataset.discount){discount[e.target.dataset.discount]=e.target.value;refreshDiscount()}if(e.target.id==='search'){search=e.target.value;document.querySelectorAll('[data-inventory-row]').forEach(el=>{el.hidden=!el.dataset.name.includes(search.toLowerCase())});document.querySelectorAll('[data-category-section]').forEach(el=>{el.hidden=![...el.querySelectorAll('[data-inventory-row]')].some(row=>!row.hidden)})}if(e.target.id==='itemName'&&modal?.type==='item'&&!modal.categoryTouched){const sel=document.getElementById('itemCategory');if(sel){const guessed=inferCategoryFor(state,e.target.value);sel.value=guessed;modal.categorySelected=guessed}}if(e.target.dataset.compare){cmp[e.target.dataset.compare][e.target.dataset.field]=e.target.value;refreshCompare()}if(e.target.id==='price'&&modal)modal.price=e.target.value;if(e.target.id==='store'&&modal)modal.store=e.target.value;if(e.target.id==='productDetail'&&modal)modal.detail=e.target.value;if(e.target.id==='purVolume'&&modal)modal.volume=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='itemCategory'&&modal?.type==='item'){modal.categoryTouched=true;modal.categorySelected=e.target.value}if(e.target.id==='compareLink'){compareLink=e.target.value;render()}if(e.target.dataset.compare){cmp[e.target.dataset.compare][e.target.dataset.field]=e.target.value;refreshCompare()}if(e.target.id==='purUnit'&&modal)modal.vu=e.target.value});
function refreshDiscount(){const r=discountResult();const total=document.getElementById('discount-total'),saved=document.getElementById('discount-saving');if(total)total.textContent=r?r.total.toLocaleString('ja-JP')+'円':'—';if(saved)saved.textContent=r?r.saving.toLocaleString('ja-JP')+'円':'—'}
function refreshCompare(){for(const k of ['a','b']){const n=compareRateFor(k),el=document.getElementById('cresult-'+k);if(el)el.textContent=n?n.n.toFixed(2)+'円':'—';const total=document.getElementById('total-'+k);if(total)total.textContent=n?n.total:'—'}const el=document.getElementById('outcome');if(el)el.innerHTML=compareOutcome(cmpResult())}
render();
})();
</script>
